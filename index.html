<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWO 表情预览</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-secondary: #666666;
            --border-color: #e2e2e2;
            --hover-border: #111111;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }
        .tab-btn.active, .tab-btn:hover {
            background: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }
        .category-section {
            display: none;
        }
        .category-section.active {
            display: block;
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }
        .emoji-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
        }
        .emoji-card:hover {
            border-color: var(--hover-border);
            transform: translateY(-2px);
        }
        .emoji-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-bottom: 6px;
        }
        .emoji-text {
            font-size: 11px;
            color: var(--text-secondary);
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .loading {
            color: var(--text-secondary);
            font-size: 14px;
        }
        a {
            color: #a3a300;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OWO 表情预览</h1>
        </header>
        <p>此为OWO表情包预览，该页面展示了目前收录的表情包。</p>
        <p style="margin-bottom: 20px;">OWO JSON位置<a href="/owo.json">owo.json</a></p>
        <div id="app">
            <div class="loading">正在加载数据...</div>
        </div>
    </div>

    <script>
        async function init() {
            const app = document.getElementById('app');
            try {
                const response = await fetch('./owo.json');
                if (!response.ok) throw new Error('无法请求 owo.json 文件');
                const data = await response.json();
                
                render(data);
            } catch (err) {
                app.innerHTML = `<div class="loading" style="color: #e53e3e;">加载失败: ${err.message}。请确保 owo.json 与本文件在同一根目录下。</div>`;
            }
        }

        function render(data) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="tabs" id="tabsContainer"></div>
                <div id="contentContainer"></div>
            `;

            const tabsContainer = document.getElementById('tabsContainer');
            const contentContainer = document.getElementById('contentContainer');
            
            let isFirst = true;

            for (const [categoryName, categoryData] of Object.entries(data)) {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${isFirst ? 'active' : ''}`;
                btn.textContent = categoryName;
                
                const section = document.createElement('div');
                section.className = `category-section ${isFirst ? 'active' : ''}`;
                
                const grid = document.createElement('div');
                grid.className = 'emoji-grid';
                
                if (categoryData.container && Array.isArray(categoryData.container)) {
                    categoryData.container.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'emoji-card';
                        
                        const iconDiv = document.createElement('div');
                        iconDiv.className = 'emoji-icon';
                        iconDiv.innerHTML = item.icon;
                        
                        const textDiv = document.createElement('div');
                        textDiv.className = 'emoji-text';
                        textDiv.textContent = item.text;
                        
                        card.appendChild(iconDiv);
                        card.appendChild(textDiv);
                        
                        grid.appendChild(card);
                    });
                }
                
                section.appendChild(grid);
                contentContainer.appendChild(section);
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.category-section').forEach(s => s.classList.remove('active'));
                    
                    btn.classList.add('active');
                    section.classList.add('active');
                });
                
                tabsContainer.appendChild(btn);
                isFirst = false;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1200);
        }

        init();
    </script>
</body>
</html>
